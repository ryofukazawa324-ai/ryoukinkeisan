.durationBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px}.durationBar input{width:58px;border:1px solid var(--line);border-radius:7px;padding:6px;text-align:right;font-size:14px}.compactRows{display:flex;flex-direction:column;gap:6px}.compactRow{display:grid;grid-template-columns:minmax(60px,1fr) 30px minmax(64px,90px) auto 22px;gap:5px;align-items:center;padding:5px;background:#f8f5fb;border:1px solid #e9e1f1;border-radius:9px}.fieldLabel{min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:#594173;font-size:12px;font-weight:750;padding:6px 2px}.fieldLabel span{opacity:.6;font-size:10px}.amountInput{width:100%;min-width:0;border:1px solid #ded5e9;border-radius:7px;padding:7px 4px;text-align:right;font-size:15px;font-weight:750;background:white}.compactRow .sign{height:32px;width:30px}.calcPick{white-space:nowrap}.removeSpacer{width:20px}.addValue{width:100%;border:1px dashed #cdbbdf;background:#fff;color:#65418b;border-radius:8px;padding:8px;margin-top:7px;font-size:12px;font-weight:750}.resultTop{display:flex;justify-content:space-between;align-items:center;font-size:12px}.resultTop strong{font-size:20px;color:var(--d)}.resultGrid{grid-template-columns:1fr 1fr}.result{padding:9px}.itemBody{padding:9px}.itemHead{padding:8px}.itemHead input{font-size:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))!important;gap:8px}@media(max-width:450px){.compactRow{grid-template-columns:minmax(50px,1fr) 27px minmax(58px,78px) auto 18px;gap:3px}.compactRow .sign{width:27px}.amountInput{font-size:13px}.calcPick{font-size:10px}.fieldLabel{font-size:11px}.cards{grid-template-columns:1fr!important}}@media(orientation:landscape) and (min-width:600px){.top{grid-template-columns:205px minmax(0,1fr)}.cards{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))!important}.compactRow{grid-template-columns:minmax(50px,1fr) 27px minmax(55px,75px) auto 18px;gap: </style></head><body><main class="app">
<header class="header"><div><div class="brand">料金計算</div><div class="muted">電卓入力・割引計算・月額／年額比較</div></div><button class="btn light" id="resetBtn">初期状態に戻す</button></header>
<div class="top"><section><div class="panel"><strong>料金比較</strong><div class="muted">項目名は自由に変更できます。割引やポイント還元は複数追加でき、＋／−で加算・減算を切り替えます。</div><div class="addrow"><button class="btn" id="addItem">＋ 比較項目を追加</button><button class="btn light" id="addAdjustment">＋ 割引・還元を追加</button><button class="btn light" id="exportBtn">データを書き出し</button><button class="btn light" id="importBtn">データを読み込み</button></div><div class="durationBar"><label>計算期間 <input id="durationYears" type="number" min="0" step="any" value="1"> 年</label><label><input id="durationMonths" type="number" min="0" step="any" value="0"> か月</label><span class="muted">数値欄の名称をタップして変更できます。</span></div></div><div class="cards" id="cards"></div></section></div>
<div class="foot">入力内容はこの端末のブラウザ内に自動保存されます。別の端末とは自動同期されません。</div></main>
<script>
const STORE='ryoukinkeisan-data-v5';
function makeId(){return Math.random().toString(36).slice(2,10)}
function initial(){return{items:[{id:makeId(),name:'項目A',price:0,priceName:'料金',adjustments:[]},{id:makeId(),name:'項目B',price:0,priceName:'料金',adjustments:[]}],durationYears:1,durationMonths:0,selected:{item:0,field:'price',adjustment:0},buffer:'0',left:null,operator:null,waiting:false}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&Array.isArray(x.items)&&x.items.length)return x}catch(e){}return initial()}
let state=load();if(!state.selected)state.selected={item:0,field:'price',adjustment:0};if(state.buffer===undefined)state.buffer='0';
state.items.forEach(it=>{if(!it.priceName)it.priceName='料金';if(!Array.isArray(it.adjustments))it.adjustments=[]});
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ja-JP',{maximumFractionDigits:8}),money=n=>fmt(n)+'円';
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function itemNow(){return state.items[state.selected.item]}
function total(it){return Number(it.price||0)+it.adjustments.reduce((s,a)=>s+(Number(a.amount)||0),0)}
function months(){return Math.max(1,(Number(state.durationYears)||0)*12+(Number(state.durationMonths)||0))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectedValue(){const it=itemNow();if(!it)return 0;if(state.selected.field==='adjustment')return it.adjustments[state.selected.adjustment]?.amount??0;if(state.selected.field==='years')return state.durationYears||0;if(state.selected.field==='months')return state.durationMonths||0;return it[state.selected.field]??0}
function targetName(){const it=itemNow();if(!it)return '入力先なし';if(state.selected.field==='price')return it.name+'：'+it.priceName;if(state.selected.field==='years')return '共通：年数';if(state.selected.field==='months')return '共通：月数';return it.name+'：'+(it.adjustments[state.selected.adjustment]?.name||'数値項目')}
function selectTarget(i,field,j=0){state.selected={item:i,field,adjustment:j};state.buffer=String(selectedValue()??0);state.left=null;state.operator=null;state.waiting=false;render()}
function renameField(i,field,j){const it=state.items[i];const obj=field==='price'?it:it.adjustments[j];const key=field==='price'?'priceName':'name';const old=obj[key]|| (field==='price'?'料金':'数値項目');const n=prompt('この数値項目の名称',old);if(n===null)return;obj[key]=n.trim()||old;save();render()}
function render(){
$('screenLabel').textContent='入力先：'+targetName();$('screenValue').textContent=fmt(state.buffer);
const targets=$('targets');targets.innerHTML='';
state.items.forEach((it,i)=>{const entries=[['price',it.priceName,0],...it.adjustments.map((a,j)=>['adjustment',a.name,j])];entries.forEach(([field,name,j])=>{const b=document.createElement('button');b.className='targetBtn'+(state.selected.item===i&&state.selected.field===field&&(field!=='adjustment'||state.selected.adjustment===j)?' active':'');b.textContent=it.name+' · '+name;b.onclick=()=>selectTarget(i,field,j);targets.appendChild(b)})});

$('durationYears').value=Number(state.durationYears)||0;$('durationMonths').value=Number(state.durationMonths)||0;
const cards=$('cards');cards.innerHTML='';
state.items.forEach((it,i)=>{const el=document.createElement('article');el.className='item'+(state.selected.item===i?' selected':'');
const rows=[{field:'price',j:0,name:it.priceName||'料金',amount:Number(it.price)||0},...it.adjustments.map((a,j)=>({field:'adjustment',j,name:a.name||'数値項目',amount:Number(a.amount)||0}))].map(r=>'<div class="compactRow"><button class="fieldLabel" data-label="'+i+','+r.field+','+r.j+'" title="タップして名称変更">'+esc(r.name)+' <span>✎</span></button><button class="sign '+(r.amount>=0?'plus':'')+'" data-sign="'+i+','+r.field+','+r.j+'" title="プラス／マイナス切替">'+(r.amount>=0?'+':'−')+'</button><input class="amountInput" aria-label="'+esc(r.name)+'の数値" inputmode="decimal" type="number" step="any" data-amount="'+i+','+r.field+','+r.j+'" value="'+Math.abs(r.amount)+'"><button class="mini calcPick" data-pick="'+i+','+r.field+','+r.j+'">電卓</button>'+(r.field==='adjustment'?'<button class="remove" data-remove="'+i+','+r.j+'" aria-label="削除">×</button>':'<span class="removeSpacer"></span>')+'</div>').join('');
const t=total(it),dur=months();el.innerHTML='<div class="itemHead"><input aria-label="比較項目名" data-rename="'+i+'" value="'+esc(it.name)+'"><button data-delete="'+i+'">削除</button></div><div class="itemBody"><div class="compactRows">'+rows+'</div><button class="addValue" data-addadj="'+i+'">＋ 数値項目を追加</button><div class="result"><div class="resultTop"><span>合計</span><strong>'+money(t)+'</strong></div><div class="resultGrid"><div><div class="lineName">月額換算</div><div class="num">'+money(t/dur)+'</div></div><div><div class="lineName" data-period="years" style="cursor:pointer">年額換算（タップで変更）</div><div class="num">'+money(t*12/dur)+'</div></div></div></div></div>';
cards.appendChild(el)});
cards.querySelectorAll('[data-rename]').forEach(x=>x.onchange=()=>{const i=+x.dataset.rename;state.items[i].name=x.value.trim()||'項目'+(i+1);save();render()});
cards.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(state.items.length===1){alert('比較項目は最低1つ必要です');return}if(confirm('この比較項目を削除しますか？')){state.items.splice(+x.dataset.delete,1);state.selected.item=Math.min(state.selected.item,state.items.length-1);state.selected.field='price';save();render()}});
cards.querySelectorAll('[data-label]').forEach(x=>x.onclick=()=>{const [i,field,j]=x.dataset.label.split(',');renameField(+i,field,+j)});cards.querySelectorAll('[data-period="years"]').forEach(x=>x.onclick=()=>{const current=Number(state.durationYears)||1;const v=prompt('何年換算にしますか？',String(current));if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<=0){alert('1以上の年数を入力してください');return}state.durationYears=n;save();render()});
cards.querySelectorAll('[data-amount]').forEach(x=>x.onchange=()=>{const [i,field,j]=x.dataset.amount.split(',');const it=state.items[+i],v=Number(x.value)||0;if(field==='price')it.price=(it.price<0?-1:1)*v;else it.adjustments[+j].amount=(it.adjustments[+j].amount<0?-1:1)*v;state.selected={item:+i,field,adjustment:+j};state.buffer=String(v);save();render()});
cards.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{const [i,field,j]=x.dataset.pick.split(',');selectTarget(+i,field,+j)});
cards.querySelectorAll('[data-sign]').forEach(x=>x.onclick=()=>{const [i,field,j]=x.dataset.sign.split(',');const it=state.items[+i];if(field==='price')it.price=-Number(it.price||0);else it.adjustments[+j].amount=-Number(it.adjustments[+j].amount||0);state.selected={item:+i,field,adjustment:+j};state.buffer=String(Math.abs(selectedValue()));save();render()});
cards.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{const [i,j]=x.dataset.remove.split(',').map(Number);state.items[i].adjustments.splice(j,1);state.selected={item:i,field:'price',adjustment:0};state.buffer=String(state.items[i].price||0);save();render()});
cards.querySelectorAll('[data-addadj]').forEach(x=>x.onclick=()=>addAdj(+x.dataset.addadj));
}
function key(k){if(k==='AC'){state.buffer='0';state.left=null;state.operator=null;state.waiting=false;render();return}if(k==='C'){state.buffer='0';state.waiting=false;render();return}if(k==='back'){state.buffer=state.buffer.length>1?state.buffer.slice(0,-1):'0';render();return}if(k==='apply'){const n=Number(state.buffer)||0,it=itemNow();if(state.selected.field==='adjustment'){const a=it.adjustments[state.selected.adjustment];if(a)a.amount=(a.amount<0?-1:1)*n}else if(state.selected.field==='years')state.durationYears=n;else if(state.selected.field==='months')state.durationMonths=n;else it[state.selected.field]=n;state.left=null;state.operator=null;state.waiting=false;save();render();return}if(k==='±'){state.buffer=String(-(Number(state.buffer)||0));render();return}if(['+','−','×','÷'].includes(k)){if(state.operator&&!state.waiting)calculate();state.left=Number(state.buffer)||0;state.operator=k;state.waiting=true;render();return}if(k==='='){if(state.operator!==null)calculate();render();return}if(k==='.'){if(state.waiting){state.buffer='0.';state.waiting=false}else if(!state.buffer.includes('.'))state.buffer+='.';render();return}if(/^[0-9]$/.test(k)){state.buffer=state.waiting?k:(state.buffer==='0'?k:state.buffer+k);state.waiting=false;render()}}
function calculate(){const a=state.left,b=Number(state.buffer)||0;let n=a;if(state.operator==='+')n=a+b;if(state.operator==='−')n=a-b;if(state.operator==='×')n=a*b;if(state.operator==='÷')n=b===0?0:a/b;state.buffer=String(Number(n.toFixed(8)));state.left=null;state.operator=null;state.waiting=true}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));
$('addItem').onclick=()=>{state.items.push({id:makeId(),name:'項目'+String.fromCharCode(65+state.items.length),price:0,priceName:'料金',adjustments:[]});state.selected={item:state.items.length-1,field:'price',adjustment:0};state.buffer='0';save();render()};
function addAdj(i){const it=state.items[i];it.adjustments.push({id:makeId(),name:'数値項目'+(it.adjustments.length+1),amount:0});state.selected={item:i,field:'adjustment',adjustment:it.adjustments.length-1};state.buffer='0';save();render()}
$('addAdjustment').onclick=()=>addAdj(state.selected.item);
$('durationYears').onchange=()=>{state.durationYears=Number($('durationYears').value)||0;save();render()};
$('durationMonths').onchange=()=>{state.durationMonths=Number($('durationMonths').value)||0;save();render()};
$('resetBtn').onclick=()=>{if(confirm('入力内容を初期状態に戻しますか？')){state=initial();save();render()}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ryoukinkeisan-backup.json';a.click();URL.revokeObjectURL(url)};
$('importBtn').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.items)||!x.items.length)throw 0;state=x;state.items.forEach(it=>{if(!it.priceName)it.priceName='料金';if(!Array.isArray(it.adjustments))it.adjustments=[]});save();render();alert('読み込みました')}catch(e){alert('ファイルを読み込めませんでした')}};r.readAsText(f)};inp.click()};
render();
</script></body></html>
