<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7650a8">
<title>料金計算</title>
<style>
:root{--purple:#7650a8;--deep:#4e2a85;--pale:#f1eafa;--line:#ded6e8;--ink:#292236;--red:#b24f58}*{box-sizing:border-box}body{margin:0;background:#f4eff9;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:14px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{font-size:24px;font-weight:850;color:var(--deep)}.muted{color:#756d80;font-size:12px}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:750;background:var(--purple);color:#fff;cursor:pointer}.btn.light{background:#fff;color:var(--deep);border:1px solid var(--line)}.top{display:grid;grid-template-columns: minmax(230px,300px) 1fr;gap:12px;align-items:start}.calc,.panel,.item{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px #40215c0c}.calc{padding:12px;position:sticky;top:8px}.screen{background:#f2edf8;border:1px solid #d9cbe9;border-radius:10px;padding:10px;margin-bottom:10px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between}.screenLabel{font-size:12px;color:#756d80}.screenValue{font-size:30px;font-weight:800;text-align:right;overflow-wrap:anywhere}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.key{min-height:48px;border:1px solid #d8cbe8;background:#f6f1fb;color:#4f376d;border-radius:10px;font-size:19px;font-weight:750;cursor:pointer}.key.op{background:#e4d6f4;color:#45236e}.key.action{background:#9c80bc;color:#fff}.key.equal{background:var(--deep);color:white}.key.wide{grid-column:span 2}.panel{padding:13px;margin-bottom:12px}.fieldlabel{font-size:12px;color:#766e80;display:block;margin-bottom:5px}.selected{font-size:14px;font-weight:750;margin-bottom:10px}.targetBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.targetBtn{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:white;color:var(--deep);font-size:12px}.targetBtn.active{background:var(--deep);color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.item{overflow:hidden}.itemHead{background:#eee5f8;padding:11px;display:flex;align-items:center;gap:8px}.itemHead input{min-width:0;flex:1;border:0;border-bottom:1px solid #cbb9de;background:transparent;padding:5px;font-size:16px;font-weight:800;color:var(--deep)}.itemHead button{border:0;background:transparent;color:#745a91;font-size:18px}.itemBody{padding:12px}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #f0ebf5}.line:last-child{border-bottom:0}.lineName{font-size:13px;color:#706779}.num{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}.num.negative{color:var(--red)}.tapfield{border:1px solid #ded5e9;background:#fff;border-radius:8px;padding:8px 9px;min-width:0;width:132px;text-align:right;font-size:16px;font-weight:700;color:var(--ink)}.lineButtons{display:flex;gap:5px}.mini{border:1px solid var(--line);background:#f8f5fc;border-radius:7px;padding:6px 8px;color:var(--deep);font-weight:700}.result{background:#f1eafa;border-radius:11px;padding:12px;margin-top:10px}.result .num{font-size:26px;color:var(--deep)}.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}.resultGrid>div{background:#fff;border-radius:9px;padding:9px}.resultGrid .num{font-size:17px}.addrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.addrow .btn{flex:1}.adjustTitle{font-size:13px;font-weight:800;margin:13px 0 4px}.adjust{display:grid;grid-template-columns:minmax(0,1fr) 86px 32px;gap:6px;align-items:center;margin:6px 0}.adjust input{min-width:0;width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:14px}.adjust input.amount{text-align:right;font-weight:700}.adjust button{border:0;background:#f7e9eb;color:#a43e4a;border-radius:7px;height:34px}.empty{text-align:center;padding:30px;color:#82788e;background:#fff;border:1px dashed var(--line);border-radius:14px}.foot{font-size:12px;color:#766d80;margin:14px 2px}@media(max-width:720px){.top{grid-template-columns:1fr}.calc{position:static}.screenValue{font-size:27px}.key{min-height:44px}.cards{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}}@media(max-width:400px){.app{padding:9px}.cards{grid-template-columns:1fr}.header{align-items:flex-start}.brand{font-size:21px}.tapfield{width:118px}}
</style>
</head>
<body><main class="app">
<header class="header"><div><div class="brand">料金計算</div><div class="muted">電卓入力・割引計算・月額／年額比較</div></div><button class="btn light" id="resetBtn">初期状態に戻す</button></header>
<div class="top">
<section class="calc">
<div class="screen"><div class="screenLabel" id="screenLabel">入力先：料金</div><div class="screenValue" id="screenValue">0</div></div>
<div class="keypad">
<button class="key action" data-key="AC">AC</button><button class="key action" data-key="C">C</button><button class="key op" data-key="±">±</button><button class="key op" data-key="÷">÷</button>
<button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key op" data-key="×">×</button>
<button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key op" data-key="−">−</button>
<button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key op" data-key="+">＋</button>
<button class="key wide" data-key="0">0</button><button class="key" data-key=".">.</button><button class="key equal" data-key="=">＝</button>
<button class="key action wide" data-key="apply">入力先に反映</button><button class="key op wide" data-key="back">1文字戻す</button>
</div>
<div class="muted" style="margin-top:9px">入力先を選び、数字キーで入力。「＋」「−」などで計算し「入力先に反映」を押します。</div>
<div class="targetBtns" id="targets"></div>
</section>
<section>
<div class="panel"><div style="font-weight:800;margin-bottom:4px">料金比較</div><div class="muted">項目名を変更できます。各料金や割引額は、左の電卓または数値欄から入力できます。</div>
<div class="addrow"><button class="btn" id="addItem">＋ 比較項目を追加</button><button class="btn light" id="addAdjustment">＋ 割引・還元を追加</button></div>
<div class="muted">計算式：料金 ＋ 加算 − 割引・ポイント還元</div></div>
<div class="cards" id="cards"></div>
</section></div>
<div class="foot">入力データはこの端末のブラウザ内に保存されます。別の端末とは自動同期されません。</div>
</main>
<script>
const STORE='ryoukinkeisan-data-v1';
const initial=()=>({items:[{id:makeId(),name:'プランA',price:50380,adjustments:[{id:makeId(),name:'ポイント還元',amount:-5000},{id:makeId(),name:'割引',amount:-3000}],years:7,months:12},{id:makeId(),name:'プランB',price:30690,adjustments:[{id:makeId(),name:'ポイント還元',amount:-5000},{id:makeId(),name:'割引',amount:-2000}],years:7,months:12}],selected:{item:0,field:'price',adjustment:0},buffer:'0',left:null,operator:null,waiting:false});
function makeId(){return Math.random().toString(36).slice(2,10)}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&Array.isArray(x.items)&&x.items.length)return x}catch(e){}return initial()}
let state=load();
if(!state.selected)state.selected={item:0,field:'price',adjustment:0};
if(state.buffer===undefined)state.buffer='0';
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('ja-JP',{maximumFractionDigits:8});
const money=n=>fmt(n)+'円';
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function itemNow(){return state.items[state.selected.item]}
function targetName(){const it=itemNow();if(!it)return '入力先なし';if(state.selected.field==='price')return it.name+'：料金';if(state.selected.field==='years')return it.name+'：年数';if(state.selected.field==='months')return it.name+'：月数';const a=it.adjustments[state.selected.adjustment];return it.name+'：'+(a?a.name:'割引・加算')}
function val(it,field){return Number(it[field])||0}
function total(it){return val(it,'price')+it.adjustments.reduce((s,a)=>s+(Number(a.amount)||0),0)}
function divisor(it){return Math.max(1,val(it,'years')*12+val(it,'months'))}
function render(){ $('screenLabel').textContent='入力先：'+targetName();$('screenValue').textContent=fmt(state.buffer);$('targets').innerHTML='';
state.items.forEach((it,i)=>{[['price','料金'],...it.adjustments.map((a,j)=>['adj'+j,a.name]),['years','年数'],['months','月数']].forEach(([f,n])=>{const b=document.createElement('button');b.className='targetBtn'+(state.selected.item===i&&((f==='price'&&state.selected.field==='price')||(f==='years'&&state.selected.field==='years')||(f==='months'&&state.selected.field==='months')||(f.startsWith('adj')&&state.selected.field==='adjustment'&&state.selected.adjustment===Number(f.slice(3))))?' active':'');b.textContent=it.name+' · '+n;b.onclick=()=>{state.selected={item:i,field:f.startsWith('adj')?'adjustment':f,adjustment:f.startsWith('adj')?Number(f.slice(3)):0};state.buffer=String(selectedValue()??0);state.left=null;state.operator=null;state.waiting=false;render()};$('targets').appendChild(b)})});
const wrap=$('cards');wrap.innerHTML='';
state.items.forEach((it,i)=>{const el=document.createElement('article');el.className='item';const adjRows=it.adjustments.map((a,j)=>'<div class="adjust"><input aria-label="割引名" data-i="'+i+'" data-j="'+j+'" data-prop="name" value="'+esc(a.name)+'" placeholder="項目名"><input aria-label="割引・加算額" class="amount" inputmode="decimal" data-i="'+i+'" data-j="'+j+'" data-prop="amount" value="'+esc(String(a.amount))+'" type="number" step="any"><button data-remove="'+i+','+j+'" aria-label="削除">×</button></div>').join('');
el.innerHTML='<div class="itemHead"><input aria-label="比較項目名" data-rename="'+i+'" value="'+esc(it.name)+'"><button data-delete="'+i+'" title="項目を削除">削除</button></div><div class="itemBody"><div class="line"><div class="lineName">料金（円）</div><div class="lineButtons"><input class="tapfield" type="number" step="any" inputmode="decimal" data-field="'+i+',price" value="'+esc(String(it.price))+'"><button class="mini" data-select="'+i+',price">電卓</button></div></div><div class="adjustTitle">割引・還元・加算（マイナスは割引）</div>'+adjRows+'<div class="line"><div class="lineName">期間（年）</div><div class="lineButtons"><input class="tapfield" type="number" min="0" step="any" data-field="'+i+',years" value="'+esc(String(it.years))+'"><button class="mini" data-select="'+i+',years">電卓</button></div></div><div class="line"><div class="lineName">追加の月数</div><div class="lineButtons"><input class="tapfield" type="number" min="0" step="any" data-field="'+i+',months" value="'+esc(String(it.months))+'"><button class="mini" data-select="'+i+',months">電卓</button></div></div><div class="result"><div class="lineName">実質料金</div><div class="num">'+money(total(it))+'</div><div class="resultGrid"><div><div class="lineName">月額換算</div><div class="num">'+money(total(it)/divisor(it))+'</div></div><div><div class="lineName">年額換算</div><div class="num">'+money(total(it)*12/divisor(it))+'</div></div></div><div class="muted" style="margin-top:8px">期間：'+fmt(divisor(it)/12)+'年相当（'+fmt(divisor(it))+'か月）</div></div></div>';
wrap.appendChild(el)});
wrap.querySelectorAll('[data-rename]').forEach(x=>x.addEventListener('change',()=>{const i=+x.dataset.rename;state.items[i].name=x.value.trim()||'項目'+(i+1);save();render()}));
wrap.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(state.items.length===1){alert('比較項目は最低1つ必要です');return}if(confirm('この比較項目を削除しますか？')){const i=+x.dataset.delete;state.items.splice(i,1);state.selected.item=Math.min(state.selected.item,state.items.length-1);state.selected.field='price';state.selected.adjustment=0;save();render()}});
wrap.querySelectorAll('[data-field]').forEach(x=>x.addEventListener('change',()=>{const [i,f]=x.dataset.field.split(',');state.items[+i][f]=Number(x.value)||0;state.selected={item:+i,field:f,adjustment:0};state.buffer=String(state.items[+i][f]);save();render()}));
wrap.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{const [i,f]=x.dataset.select.split(',');state.selected={item:+i,field:f,adjustment:0};state.buffer=String(state.items[+i][f]??0);state.left=null;state.operator=null;state.waiting=false;render()});
wrap.querySelectorAll('[data-prop]').forEach(x=>x.addEventListener('change',()=>{const i=+x.dataset.i,j=+x.dataset.j,p=x.dataset.prop;state.items[i].adjustments[j][p]=p==='amount'?(Number(x.value)||0):x.value.trim()||'割引';save();render()}));
wrap.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{const [i,j]=x.dataset.remove.split(',').map(Number);state.items[i].adjustments.splice(j,1);state.selected={item:i,field:'price',adjustment:0};state.buffer=String(state.items[i].price);save();render()});
}
function selectedValue(){const it=itemNow();if(!it)return 0;if(state.selected.field==='adjustment')return it.adjustments[state.selected.adjustment]?.amount??0;return it[state.selected.field]??0}
function setSelectedValue(n){const it=itemNow();if(!it)return;if(state.selected.field==='adjustment'){const a=it.adjustments[state.selected.adjustment];if(a)a.amount=n}else it[state.selected.field]=n;save()}
function key(k){if(k==='AC'){state.buffer='0';state.left=null;state.operator=null;state.waiting=false;render();return}
if(k==='C'){state.buffer='0';state.waiting=false;render();return}
if(k==='back'){state.buffer=state.buffer.length>1?state.buffer.slice(0,-1):'0';render();return}
if(k==='apply'){const n=Number(state.buffer)||0;setSelectedValue(n);state.left=null;state.operator=null;state.waiting=false;render();return}
if(k==='±'){state.buffer=String(-(Number(state.buffer)||0));render();return}
if(['+','−','×','÷'].includes(k)){state.left=Number(state.buffer)||0;state.operator=k;state.waiting=true;render();return}
if(k==='='){if(state.operator&&state.left!==null){const b=Number(state.buffer)||0;let n=state.left;if(state.operator==='+')n+=b;if(state.operator==='−')n-=b;if(state.operator==='×')n*=b;if(state.operator==='÷')n=b===0?0:n/b;state.buffer=String(Number(n.toFixed(8)));state.left=null;state.operator=null;state.waiting=true;render()}return}
if(k==='.'){if(state.waiting){state.buffer='0.';state.waiting=false}else if(!state.buffer.includes('.'))state.buffer+='.';render();return}
if(/^d$/.test(k)){state.buffer=state.waiting?k:(state.buffer==='0'?k:state.buffer+k);state.waiting=false;render()}}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>key(b.dataset.key)));
$('addItem').onclick=()=>{state.items.push({id:makeId(),name:'プラン'+String.fromCharCode(65+state.items.length),price:0,adjustments:[],years:1,months:0});state.selected={item:state.items.length-1,field:'price',adjustment:0};state.buffer='0';save();render()};
$('addAdjustment').onclick=()=>{const it=itemNow();if(!it){alert('先に比較項目を追加してください');return}it.adjustments.push({id:makeId(),name:'割引・還元',amount:0});state.selected={item:state.selected.item,field:'adjustment',adjustment:it.adjustments.length-1};state.buffer='0';save();render()};
$('resetBtn').onclick=()=>{if(confirm('入力内容を初期状態に戻しますか？')){state=initial();save();render()}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
